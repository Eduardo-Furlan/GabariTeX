name: Release Desktop Binaries

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Salvar como rascunho (Draft - invisível para usuários comuns)"
        type: boolean
        default: true
      prerelease:
        description: "Marcar como pré-lançamento (Pre-release)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libopencv-dev \
            clang \
            libclang-dev

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install llvm opencv -y --no-progress
          $opencv_vc = Get-ChildItem "C:\tools\opencv\build\x64" -Directory | Where-Object { $_.Name -like "vc*" } | Select-Object -Last 1
          if (-not $opencv_vc) {
            throw "Diretório de build do OpenCV não encontrado em C:\tools\opencv\build\x64"
          }
          $opencv_vc_path = $opencv_vc.FullName
          Write-Host "OpenCV localizado em: $opencv_vc_path"

          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_PATHS=$opencv_vc_path\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OpenCV_DIR=$opencv_vc_path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$opencv_vc_path\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path "src-tauri\resources\windows"
          Copy-Item "$opencv_vc_path\bin\opencv_world*.dll" -Destination "src-tauri\resources\windows\"
          Get-ChildItem "src-tauri\resources\windows"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "GabariTeX v__VERSION__"
          releaseBody: "Versão de teste / pré-lançamento do GabariTeX para Linux e Windows."
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gabaritex-${{ matrix.target }}-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

