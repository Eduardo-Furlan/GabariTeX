name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Python Pillow for OMR tests
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Run Vitest
        run: npm test

  test-backend:
    name: Backend Tests (Cargo)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux and OpenCV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libopencv-dev \
            clang \
            libclang-dev

      - name: Run Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  test-backend-windows:
    name: Backend Tests Windows (Cargo)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Windows dependencies
        shell: powershell
        run: |
          choco install llvm -y --no-progress
          choco install opencv --version 4.9.0 -y --no-progress
          $opencv_vc = Get-ChildItem "C:\tools\opencv\build\x64" -Directory | Where-Object { $_.Name -like "vc*" } | Select-Object -Last 1
          if (-not $opencv_vc) {
            throw "Diretório de build do OpenCV não encontrado em C:\tools\opencv\build\x64"
          }
          $opencv_vc_path = $opencv_vc.FullName
          Write-Host "OpenCV localizado em: $opencv_vc_path"

          $lib_file = (Get-ChildItem "$opencv_vc_path\lib\opencv_world*.lib" | Select-Object -First 1)
          if (-not $lib_file) {
            throw "opencv_world .lib não encontrado em $opencv_vc_path\lib"
          }
          $lib_name = $lib_file.BaseName
          Write-Host "OpenCV link lib: $lib_name"

          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_PATHS=$opencv_vc_path\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_LIBS=$lib_name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OpenCV_DIR=$opencv_vc_path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$opencv_vc_path\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path "src-tauri\resources\windows"
          Copy-Item "$opencv_vc_path\bin\opencv_world*.dll" -Destination "src-tauri\resources\windows\"
          Get-ChildItem "src-tauri\resources\windows"

      - name: Run Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

